[project]
name = "projeto-engenheiro-junior"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "streamlit>=1.66.1",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]

[tool.coverage.run]
source = ["."]
omit = ["test/*", ".venv/*", "fix_stdout*.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true